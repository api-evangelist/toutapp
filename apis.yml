name: ToutApp
description: >-
  ToutApp was a sales-engagement platform founded in 2011 by Tawheed Kader that
  gave sales teams email templates, email tracking, campaigns, and analytics for
  outbound selling, backed by Andreessen Horowitz. Marketo acquired ToutApp in
  May 2017 and folded the product into Marketo Sales Connect (later part of
  Adobe after Adobe acquired Marketo in 2018). The company is defunct as a
  standalone business - toutapp.com now redirects to Adobe's Marketo Sales
  Connect page - and no independent ToutApp API or developer surface remains
  publicly available.
